{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-header bg-white fw-semibold">Add Location</div>
      <div class="card-body">
        <form method="POST" novalidate>
          {{ form.hidden_tag() }}
          <div class="mb-3">
            {{ form.name.label(class='form-label') }}
            {{ form.name(class='form-control', placeholder='e.g. Zone D – Northern District') }}
          </div>
          <div class="d-flex gap-2">
            {{ form.submit(class='btn btn-success') }}
            <a href="{{ url_for('admin.index') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
